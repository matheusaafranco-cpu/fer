<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>te amo ghata</title>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ff4b72;
      --primary-dark: #d6335c;
      --accent: #ff85a2;
      --bg-dark: #0f0c1b;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-light: #ffffff;
      --text-muted: #d0c8db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 75, 114, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
      color: var(--text-light);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 60px;
    }

    /* Background Floating Hearts */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      color: var(--accent);
      opacity: 0.6;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 0 5px rgba(255, 75, 114, 0.5));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* MODAL PERGUNTA INICIAL */
    .question-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 12, 27, 0.95);
      backdrop-filter: blur(15px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      transition: opacity 0.5s ease;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
    }

    .question-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #fff;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 10px rgba(255, 75, 114, 0.8);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 1.5rem;
      min-height: 60px;
      position: relative;
    }

    .btn-love {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-yes {
      background: var(--primary);
      color: white;
      box-shadow: 0 0 15px rgba(255, 75, 114, 0.6);
    }

    .btn-yes:hover {
      transform: scale(1.1);
      background: var(--primary-dark);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid var(--card-border);
      transition: none !important;
      z-index: 10000;
    }

    .btn-no.teleporting {
      position: fixed;
    }

    .angry-message {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: popIn 0.3s ease;
    }

    .middle-finger-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: shake 0.5s infinite alternate;
    }

    @keyframes shake {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Conteúdo Principal */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 75, 114, 0.8);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 1rem;
      text-align: center;
    }

    .timer-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.2rem 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .timer-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .timer-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .timer-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Slideshow */
    .slideshow-container {
      position: relative;
      width: 100%;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide.active { opacity: 1; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slide img.vertical-foto {
      object-fit: cover;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      padding: 2rem 1.5rem 1rem;
      color: #fff;
      text-align: center;
      font-size: 1.1rem;
      z-index: 5;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .nav-btn:hover { background: var(--primary); }
    .prev-btn { left: 15px; }
    .next-btn { right: 15px; }

    @media (max-width: 600px) {
      .title { font-size: 2.5rem; }
      .slideshow-container { height: 350px; }
      .timer-grid { grid-template-columns: repeat(2, 1fr); }
      .glass-card { padding: 1.2rem; }
      .question-title { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- Partículas de fundo -->
  <div id="hearts-container"></div>

  <!-- MODAL DE PERGUNTA INICIAL -->
  <div class="question-overlay" id="question-modal">
    <div class="question-card">
      <div id="question-block">
        <h2 class="question-title">Você me ama? ❤️</h2>
        <div class="btn-group" id="btn-group">
          <button class="btn-love btn-yes" id="btn-yes">
            <i class="fa-solid fa-heart"></i> SIM!
          </button>
          <button class="btn-love btn-no" id="btn-no">
            NÃO
          </button>
        </div>
      </div>

      <div class="angry-message" id="angry-block">
        <div class="middle-finger-icon">🖕</div>
        <h2 class="question-title" style="color: #ff4b72;">AMA SIM! 😡❤️</h2>
        <p style="margin-top: 10px; color: var(--text-muted);">Achou mesmo que conseguiria dizer não?</p>
        <button class="btn-love btn-yes" id="btn-try-again" style="margin-top: 20px;">
          Clicar no SIM do jeito certo 😁
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <div class="container">
    
    <header>
      <h1 class="title">Fer</h1>
      <p class="subtitle">te amo sua chata ❤️</p>
    </header>

    <!-- Cronômetro de Tempo -->
    <section class="glass-card">
      <div class="timer-header">
        <div class="section-title">
          <i class="fa-solid fa-clock-rotate-left"></i> Juntos Há...
        </div>
      </div>

      <div class="timer-grid">
        <div class="timer-box"><div class="timer-number" id="years">00</div><div class="timer-label">Anos</div></div>
        <div class="timer-box"><div class="timer-number" id="days">00</div><div class="timer-label">Dias</div></div>
        <div class="timer-box"><div class="timer-number" id="hours">00</div><div class="timer-label">Horas</div></div>
        <div class="timer-box"><div class="timer-number" id="minutes">00</div><div class="timer-label">Minutos</div></div>
        <div class="timer-box"><div class="timer-number" id="seconds">00</div><div class="timer-label">Segundos</div></div>
      </div>
    </section>

    <!-- Carrossel de 5 Fotos -->
    <section class="glass-card">
      <div class="section-title" style="margin-bottom: 1rem;">
        <i class="fa-solid fa-images"></i> Nossas fotos 
      </div>

      <div class="slideshow-container" id="slideshow">
        <button class="nav-btn prev-btn" id="prev-slide"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-btn next-btn" id="next-slide"><i class="fa-solid fa-chevron-right"></i></button>

        <div class="slide active">
          <img src="foto1.jpg" alt="Foto 1">
          <div class="slide-caption">Nosso momento 1 ❤️</div>
        </div>

        <div class="slide">
          <img src="foto2.webp" alt="Foto 2">
          <div class="slide-caption">Nosso momento 2 ❤️</div>
        </div>

        <div class="slide">
          <img src="foto3.jpg" alt="Foto 3">
          <div class="slide-caption">Nosso momento 3 ❤️</div>
        </div>

        <div class="slide">
          <img src="foto4.jpg" class="vertical-foto" alt="Foto 4">
          <div class="slide-caption">te amo garoto, vc é minha vida. 🤍🤎</div>
        </div>

        <div class="slide">
          <img src="foto5.jpg" alt="Foto 5">
          <div class="slide-caption">Nosso momento 5 ❤️</div>
        </div>

      </div>
    </section>

  </div>

  <script>
    const DATA_QUE_NOS_CONHECEMOS = {
      ano: 2023,
      mes: 5,    
      dia: 15,
      hora: 10,
      minuto: 0
    };

    const startDate = new Date(
      DATA_QUE_NOS_CONHECEMOS.ano,
      DATA_QUE_NOS_CONHECEMOS.mes - 1,
      DATA_QUE_NOS_CONHECEMOS.dia,
      DATA_QUE_NOS_CONHECEMOS.hora,
      DATA_QUE_NOS_CONHECEMOS.minuto
    );

    /* --- LÓGICA DA PERGUNTA INICIAL --- */
    const questionModal = document.getElementById('question-modal');
    const questionBlock = document.getElementById('question-block');
    const angryBlock = document.getElementById('angry-block');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const btnTryAgain = document.getElementById('btn-try-again');

    let noClickCount = 0;

    function teleportNoBtn() {
      // Nos 2 primeiros cliques ele foge. No 3º clique ele para de fugir para permitir abrir a mensagem!
      if (noClickCount >= 2) return; 

      if (!btnNo.classList.contains('teleporting')) {
        btnNo.classList.add('teleporting');
      }

      const btnWidth = btnNo.offsetWidth || 100;
      const btnHeight = btnNo.offsetHeight || 40;

      const maxX = window.innerWidth - btnWidth - 20;
      const maxY = window.innerHeight - btnHeight - 20;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;
    }

    btnNo.addEventListener('mouseover', teleportNoBtn);
    btnNo.addEventListener('touchstart', (e) => {
      if (noClickCount < 2) {
        e.preventDefault();
        teleportNoBtn();
      }
    });

    btnNo.addEventListener('click', () => {
      noClickCount++;
      
      if (noClickCount < 3) {
        teleportNoBtn();
      } else {
        // No 3º clique ele para de fugir, esconde a pergunta e mostra a mensagem do dedo do meio
        questionBlock.style.display = 'none';
        angryBlock.style.display = 'flex';
        btnNo.style.display = 'none';
      }
    });

    btnTryAgain.addEventListener('click', () => {
      angryBlock.style.display = 'none';
      questionBlock.style.display = 'block';
    });

    btnYes.addEventListener('click', () => {
      questionModal.style.opacity = '0';
      setTimeout(() => {
        questionModal.style.display = 'none';
      }, 500);
    });

    /* --- CRONÔMETRO DE TEMPO --- */
    const yearsEl = document.getElementById('years');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function updateTimer() {
      const now = new Date();
      let diffMs = now - startDate;
      if (diffMs < 0) diffMs = 0;

      const secondsTotal = Math.floor(diffMs / 1000);
      const minutesTotal = Math.floor(secondsTotal / 60);
      const hoursTotal = Math.floor(minutesTotal / 60);
      const daysTotal = Math.floor(hoursTotal / 24);

      const years = Math.floor(daysTotal / 365);
      const days = daysTotal % 365;
      const hours = hoursTotal % 24;
      const minutes = minutesTotal % 60;
      const seconds = secondsTotal % 60;

      const pad = (num) => num.toString().padStart(2, '0');
      yearsEl.textContent = pad(years);
      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    /* --- SLIDESHOW DE FOTOS --- */
    const slideshowContainer = document.getElementById('slideshow');
    const prevBtn = document.getElementById('prev-slide');
    const nextBtn = document.getElementById('next-slide');

    let currentSlideIndex = 0;
    let autoSlideInterval;

    function getSlides() { return slideshowContainer.querySelectorAll('.slide'); }

    function showSlide(index) {
      const slides = getSlides();
      if (slides.length === 0) return;
      slides.forEach(slide => slide.classList.remove('active'));

      if (index >= slides.length) currentSlideIndex = 0;
      else if (index < 0) currentSlideIndex = slides.length - 1;
      else currentSlideIndex = index;

      slides[currentSlideIndex].classList.add('active');
    }

    function nextSlide() { showSlide(currentSlideIndex + 1); }
    function prevSlide() { showSlide(currentSlideIndex - 1); }

    function startAutoSlide() {
      if (autoSlideInterval) clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(nextSlide, 4000);
    }

    nextBtn.addEventListener('click', () => { nextSlide(); startAutoSlide(); });
    prevBtn.addEventListener('click', () => { prevSlide(); startAutoSlide(); });

    startAutoSlide();

    /* --- CORAÇÕES FLUTUANTES --- */
    const heartsContainer = document.getElementById('hearts-container');
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = `<i class="fa-solid fa-heart"></i>`;

      const startX = Math.random() * 100;
      const size = Math.random() * 1.2 + 0.6;
      const duration = Math.random() * 6 + 6;

      heart.style.left = `${startX}vw`;
      heart.style.fontSize = `${size}rem`;
      heart.style.animationDuration = `${duration}s`;

      heartsContainer.appendChild(heart);
      setTimeout(() => { heart.remove(); }, duration * 1000);
    }
    setInterval(createHeart, 500);
  </script>
</body>
</html>
